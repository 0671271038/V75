<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisetrader V75 PRO HTTP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070a14;color:#e8eefc;font-family:Arial;padding:16px}
.header{text-align:center;padding:18px 0 10px}
.header h1{font-size:32px;font-weight:900}
.header h1 span{color:#3d7cff}
.header p{color:#7a8bb0;font-size:13px;margin-top:6px}
.card{background:linear-gradient(180deg,#121a2f 0%,#0e1529 100%);border:1px solid #1c2947;border-radius:22px;padding:20px 18px;margin-top:16px}
.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #1a2642;font-size:14px}
.row:last-child{border:0}
.label{color:#8a9dc2}
.val{font-weight:700;display:flex;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;margin-right:8px}
.dot-buy{background:#00e676;box-shadow:0 0 10px rgba(0,230,118,0.6)}
.dot-sell{background:#ff3d57;box-shadow:0 0 10px rgba(255,61,87,0.6)}
.dot-wait{background:#ffca28;box-shadow:0 0 10px rgba(255,202,40,0.6)}
.price{color:#5b8cff;font-size:15px}
.live{margin-top:14px;text-align:center;font-size:11px;padding:8px;border-radius:10px;background:#0a1226;border:1px solid #1a2a4a}
.signal{margin-top:18px;border-radius:20px;padding:24px;text-align:center}
.signal-buy{background:linear-gradient(135deg,#00c853 0%,#00e676 100%);color:#000}
.signal-sell{background:linear-gradient(135deg,#c62828 0%,#ff3d57 100%);color:#fff}
.signal-wait{background:linear-gradient(135deg,#1a233e 0%,#222e4e 100%);color:#ffca28;border:1px solid #2a3a5e}
.sig-main{font-size:26px;font-weight:900}
.sig-sub{font-size:12px;margin-top:6px;opacity:0.9}
</style>
</head>
<body>
<div class="header">
<h1>Wisetrader <span>V75</span> 🚀</h1>
<p>REAL V75 (1s) • HTTP MODE • MT5 MATCHED</p>
</div>
<div class="card">
<div class="row"><span class="label">M5 Supertrend</span><span class="val" id="m5"><span class="dot dot-wait"></span>WAIT</span></div>
<div class="row"><span class="label">M1 Supertrend</span><span class="val" id="m1"><span class="dot dot-wait"></span>WAIT</span></div>
<div class="row"><span class="label">RSI 14 (M1)</span><span class="val" id="rsi">--</span></div>
<div class="row"><span class="label">V75 MT5 Price</span><span class="val price" id="price">Loading via HTTP...</span></div>
<div class="live" id="status">● HTTP MODE ACTIVE</div>
</div>
<div id="box" class="signal signal-wait">
<div id="icon" class="sig-main">🟡 WAIT</div>
<div id="sub" class="sig-sub">Loading...</div>
</div>
<script>
let m1C=[], ticks=[];
const P=10, M=1.8;
function dot(t){return `<span class="dot dot-${t}"></span>`;}
function setStatus(t,c){const e=document.getElementById('status');e.textContent='● '+t;e.style.color=c||'#00e676';}
async function apiCall(payload){
 try{
  let res = await fetch('https://api.deriv.com/api/v3?app_id=1089', {
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body: JSON.stringify(payload)
  });
  if(res.ok) return await res.json();
 }catch(e){} return null;
}
async function fetchCandles(){
 setStatus('FETCHING M1 CANDLES...','#ffca28');
 let data = await apiCall({ticks_history:'R_75_1S', style:'candles', granularity:60, count:60, end:'latest'});
 if(data && data.candles){
  m1C = data.candles.map(c=>({o:+c.open,h:+c.high,l:+c.low,c:+c.close}));
  setStatus('LIVE HTTP - '+m1C.length+' CANDLES','#00e676');
  analyze();
 }
}
async function fetchTick(){
 let data = await apiCall({ticks:'R_75_1S'});
 if(data && data.tick){
  let raw=parseFloat(data.tick.quote);
  document.getElementById('price').textContent='$'+(raw/100).toFixed(2)+' (MT5)';
  ticks.push(raw); if(ticks.length>200)ticks.shift();
  if(m1C.length>0){
   let cur=m1C[m1C.length-1]; cur.c=raw; cur.h=Math.max(cur.h,raw); cur.l=Math.min(cur.l,raw);
   analyze();
  } else if(ticks.length>20){
   let up=0,down=0; for(let i=1;i<ticks.length;i++) if(ticks[i]>ticks[i-1])up++;else down++;
   let tr=up>=down?'BUY':'SELL';
   document.getElementById('m1').innerHTML=dot(tr.toLowerCase())+tr+' (LIVE)';
   const box=document.getElementById('box'),ic=document.getElementById('icon'),su=document.getElementById('sub');
   if(tr==='BUY'){box.className='signal signal-buy';ic.textContent='🟢 BUY NOW';su.textContent='LIVE UPTREND - BUY ON MT5';}
   else{box.className='signal signal-sell';ic.textContent='🔴 SELL NOW';su.textContent='LIVE DOWNTREND - SELL ON MT5';}
  }
 }
}
function supertrend(cs,p,m){
 let atr=[],hl2=[];
 for(let i=0;i<cs.length;i++){
  hl2.push((cs[i].h+cs[i].l)/2);
  if(i===0)atr.push(cs[i].h-cs[i].l);
  else{let tr=Math.max(cs[i].h-cs[i].l,Math.abs(cs[i].h-cs[i-1].c),Math.abs(cs[i].l-cs[i-1].c));atr.push((atr[i-1]*(p-1)+tr)/p);}
 }
 let up=hl2.map((h,i)=>h+m*atr[i]), low=hl2.map((h,i)=>h-m*atr[i]);
 let trend='BUY', st=[];
 for(let i=0;i<cs.length;i++){
  if(i===0){st.push(low[i]);continue;}
  if(cs[i].c<=st[i-1])trend='SELL'; else if(cs[i].c>=st[i-1])trend='BUY';
  st.push(trend==='BUY'?low[i]:up[i]);
 } return {trend};
}
function rsi(cs,p=14){
 if(cs.length<p+1)return 50;let g=0,l=0;
 for(let i=cs.length-p;i<cs.length;i++){let d=cs[i].c-cs[i-1].c; if(d>=0)g+=d;else l-=d;}
 if(l===0)return 80; return 100-(100/(1+g/l));
}
function analyze(){
 if(m1C.length<20)return;
 let a1=[...m1C];
 let a5=[]; for(let i=0;i<a1.length;i+=5){let s=a1.slice(i,i+5); if(s.length===5)a5.push({o:s[0].o,h:Math.max(...s.map(x=>x.h)),l:Math.min(...s.map(x=>x.l)),c:s[4].c});}
 if(a5.length<4)return;
 let s1=supertrend(a1,P,M), s5=supertrend(a5,P,M), r=rsi(a1,14);
 document.getElementById('m5').innerHTML=dot(s5.trend.toLowerCase())+s5.trend;
 document.getElementById('m1').innerHTML=dot(s1.trend.toLowerCase())+s1.trend;
 document.getElementById('rsi').innerHTML=r.toFixed(1);
 let sig='WAIT';
 if(s5.trend==='BUY'&&s1.trend==='BUY')sig='BUY';
 else if(s5.trend==='SELL'&&s1.trend==='SELL')sig='SELL';
 if(sig==='BUY'&&r<38)sig='WAIT';
 if(sig==='SELL'&&r>62)sig='WAIT';
 const box=document.getElementById('box'),ic=document.getElementById('icon'),su=document.getElementById('sub');
 if(sig==='BUY'){box.className='signal signal-buy';ic.textContent='🟢 GOLD BUY NOW';su.textContent='M5 & M1 BUY - EXECUTE ON MT5';}
 else if(sig==='SELL'){box.className='signal signal-sell';ic.textContent='🔴 GOLD SELL NOW';su.textContent='M5 & M1 SELL - EXECUTE ON MT5';}
 else{box.className='signal signal-wait';ic.textContent='🟡 WAIT';su.textContent='NOT ALIGNED - HOLD';}
}
fetchCandles();
fetchTick();
setInterval(fetchTick, 1500);
setInterval(fetchCandles, 15000);
</script>
</body>
</html>
