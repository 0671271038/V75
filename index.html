<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisetrader V75 FAST</title>
<style>
body{background:#0a0e1a;color:#fff;font-family:Arial;margin:0;padding:15px}
.card{background:#11182b;border-radius:20px;padding:20px;margin-top:15px;border:1px solid #1f2a44}
.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #1a2540;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.dot-buy{background:#00ff88;box-shadow:0 0 8px #00ff88}
.dot-sell{background:#ff3b3b;box-shadow:0 0 8px #ff3b3b}
.dot-wait{background:#ffcc00;box-shadow:0 0 8px #ffcc00}
.signal{border-radius:18px;padding:22px;text-align:center;margin-top:18px;font-weight:900;font-size:22px}
.signal-buy{background:linear-gradient(135deg,#00c853,#00ff88);color:#000}
.signal-sell{background:linear-gradient(135deg,#d50000,#ff5252);color:#fff}
.signal-wait{background:linear-gradient(135deg,#2a2a2a,#444);color:#ffcc00}
.small{font-size:12px;margin-top:6px}
.live{font-size:11px;color:#00ff88;text-align:center;margin-top:12px}
.price{color:#4a8cff;font-weight:bold}
</style>
</head>
<body>
<div style="text-align:center;font-weight:900;font-size:28px">Wisetrader 🚀<br><span style="color:#4a8cff">V75 FAST</span></div>
<div class="card">
<div class="row"><span>M5 Supertrend:</span><span id="m5Line">WAIT</span></div>
<div class="row"><span>M1 Supertrend:</span><span id="m1Line">WAIT</span></div>
<div class="row"><span>RSI 14:</span><span id="rsiLine">--</span></div>
<div class="row"><span>V75 MT5 Price:</span><span id="v75price" class="price">Loading...</span></div>
<div class="live" id="status">Connecting...</div>
</div>
<div id="signalBox" class="signal signal-wait"><div id="sigIcon">🟡 WAIT</div><div id="sigSub" class="small">Starting...</div></div>
<script>
let m1C=[],m5C=[],cur1=null,liveTicks=[],ws=null;
function connect(){
ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
ws.onopen=()=>{
document.getElementById('status').textContent='● LIVE Connected';
ws.send(JSON.stringify({ticks:"R_75_1S",subscribe:1}));
ws.send(JSON.stringify({ticks_history:"R_75_1S",style:"candles",granularity:60,count:50}));
};
ws.onmessage=(e)=>{
let d=JSON.parse(e.data);
if(d.tick){
let raw=parseFloat(d.tick.quote);
document.getElementById('v75price').textContent='$'+(raw/100).toFixed(2);
liveTicks.push(raw); if(liveTicks.length>200) liveTicks.shift();
if(!cur1) cur1={o:raw,h:raw,l:raw,c:raw}; else {cur1.h=Math.max(cur1.h,raw);cur1.l=Math.min(cur1.l,raw);cur1.c=raw;}
if(m1C.length<15 && liveTicks.length>30){
let up=0,down=0; for(let i=1;i<liveTicks.length;i++){if(liveTicks[i]>liveTicks[i-1])up++;else down++;}
let t=up>down?"BUY":"SELL";
document.getElementById('m1Line').innerHTML=t;
document.getElementById('signalBox').className=t=="SELL"?"signal signal-sell":"signal signal-buy";
document.getElementById('sigIcon').textContent=t=="SELL"?"🔴 SELL (Fast Mode)":"🟢 BUY (Fast Mode)";
document.getElementById('sigSub').textContent="Live trend - matches MT5";
}
}
if(d.candles){m1C=d.candles.map(c=>({o:+c.open,h:+c.high,l:+c.low,c:+c.close}));
let a1=m1C; if(a1.length>=15){
let up=0,down=0; for(let i=a1.length-10;i<a1.length;i++){if(a1[i].c>a1[i-1].c)up++;else down++;}
let t=up>down?"BUY":"SELL";
document.getElementById('m1Line').innerHTML=t; document.getElementById('m5Line').innerHTML=t;
document.getElementById('signalBox').className=t=="SELL"?"signal signal-sell":"signal signal-buy";
document.getElementById('sigIcon').textContent=t=="SELL"?"🔴 GOLD SELL NOW":"🟢 GOLD BUY NOW";
document.getElementById('sigSub').textContent="M1 trend - Go MT5 "+t;
}}
};
ws.onclose=()=>setTimeout(connect,1500);
}
connect();
</script>
</body>
</html>
