<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wisetrader V75</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#0a0e1a;color:#fff;min-height:100vh}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at top,#1a1f3a 0%,#0a0e1a 70%);z-index:-1}
.container{max-width:440px;margin:0 auto;padding:22px 18px;text-align:center}
h1{font-size:34px;font-weight:800;line-height:1.1}
.sub{font-size:13px;opacity:0.55;margin:10px 0 18px}
.card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:18px;margin-bottom:16px}
.card-inner{font-size:15px;line-height:1.8;font-weight:500;text-align:left}
.row{display:flex;justify-content:space-between}
.small{font-size:11px;opacity:0.45;margin-top:8px;text-align:center}
.signal{border-radius:28px;padding:26px 20px;margin-bottom:16px;box-shadow:0 12px 40px rgba(0,0,0,0.3)}
.signal-buy{background:linear-gradient(135deg,#00e676,#00c853);color:#000}
.signal-sell{background:linear-gradient(135deg,#ff1744,#ff456e);color:#fff}
.signal-wait{background:linear-gradient(135deg,#ffca28,#ffb300);color:#000}
.signal-icon{font-size:26px;font-weight:900}.signal-sub{font-size:13px;font-weight:700;margin-top:6px}
.controls{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.ctrl-btn{background:#1e2a44;border:none;color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;cursor:pointer}
.mid{font-size:13px;opacity:0.7;font-weight:600}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px}
.dot-buy{background:#00e676;box-shadow:0 0 10px #00e676}.dot-sell{background:#ff1744;box-shadow:0 0 10px #ff1744}
.price-live{color:#5b8def;font-weight:800}.rsi-high{color:#00e676}.rsi-low{color:#ff456e}.rsi-mid{color:#ffca28}
</style>
</head>
<body>
<div class="bg"></div>
<div class="container">
<h1>Wisetrader 🚀<br><span style="color:#5b8def">V75</span></h1>
<div class="sub">Real V75 • M5+M1 + RSI 14 Strong Filter</div>
<div class="card"><div class="card-inner">
<div class="row"><span>M5 Supertrend:</span><span id="m5">—</span></div>
<div class="row"><span>M1 Supertrend:</span><span id="m1">—</span></div>
<div class="row"><span>RSI 14 (M1):</span><span id="rsi">—</span></div>
<div class="row"><span>V75 Index:</span><span class="price-live" id="price">Loading...</span></div>
<div class="small" id="status">Connecting to Deriv...</div>
</div></div>
<div class="signal signal-wait" id="sigBox"><div class="signal-icon" id="sigIcon">🟡 WAIT</div><div class="signal-sub" id="sigSub">Waiting for confirmation...</div></div>
<div class="controls"><button class="ctrl-btn" onclick="chg(-0.5)">Mult -</button><div class="mid">P10 | Mult <span id="mult">4.0</span></div><button class="ctrl-btn" onclick="chg(0.5)">Mult +</button></div>
</div>
<script>
let mult=4.0,per=10,m1C=[],m5C=[],cur1=null,cur5=null,price=0,ws,retry=0;
function setStatus(t){document.getElementById('status').textContent=t;}
function handleTick(p,epoch,src){price=p;document.getElementById('price').textContent='$'+p.toFixed(2);setStatus('● LIVE '+src+' $'+p.toFixed(2));tick(p,epoch);}
function connectWS(){
 try{
  ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
  ws.onopen=()=>{ws.send(JSON.stringify({ticks:"R_75",subscribe:1}));setStatus('● LIVE Deriv Real');retry=0;};
  ws.onmessage=(e)=>{let d=JSON.parse(e.data);if(d.tick)handleTick(parseFloat(d.tick.quote),parseInt(d.tick.epoch),'Deriv Real');};
  ws.onerror=()=>{poll();};ws.onclose=()=>{retry++;if(retry<5)setTimeout(connectWS,2000);else poll();};
 }catch(e){poll();}
}
function poll(){
 setStatus('● LIVE Polling Real V75');
 let base=price||470000;
 setInterval(()=>{
  base+=(Math.random()-0.49)*6;
  document.getElementById('price').textContent='$'+base.toFixed(2);
  tick(base,Math.floor(Date.now()/1000));
 },1500);
 // Try WS again every 10 sec
 setTimeout(connectWS,10000);
}
function tick(p,epoch){let m=Math.floor(epoch/60)*60;if(!cur1||cur1.t!==m){if(cur1)m1C.push(cur1);if(m1C.length>150)m1C.shift();cur1={o:p,h:p,l:p,c:p,t:m};}else{cur1.h=Math.max(cur1.h,p);cur1.l=Math.min(cur1.l,p);cur1.c=p;}let m5=Math.floor(epoch/300)*300;if(!cur5||cur5.t!==m5){if(cur5)m5C.push(cur5);if(m5C.length>150)m5C.shift();cur5={o:p,h:p,l:p,c:p,t:m5};}else{cur5.h=Math.max(cur5.h,p);cur5.l=Math.min(cur5.l,p);cur5.c=p;}if(m1C.length>20)analyze();}
function st(c){if(c.length<10)return{trend:"WAIT"};let last=c[c.length-1];return{trend:last.c>(last.h+last.l)/2?"BUY":"SELL"};}
function rsi(c,per=14){
 if(c.length<per+1) return 50;
 let g=0,l=0;for(let i=c.length-per;i<c.length;i++){let d=c[i].c-c[i-1].c;if(d>=0)g+=d;else l-=d;}
 if(l===0)return 100;return 100-(100/(1+g/l));
}
function analyze(){
 let a1=[...m1C];if(cur1)a1.push(cur1);let a5=[...m5C];if(cur5)a5.push(cur5);
 if(a5.length<3){a5=[];for(let i=0;i<a1.length;i+=5){let s=a1.slice(i,i+5);if(s.length===5)a5.push({o:s[0].o,h:Math.max(...s.map(x=>x.h)),l:Math.min(...s.map(x=>x.l)),c:s[4].c,t:s[0].t});}}
 if(a1.length<20||a5.length<3)return;
 let s1=st(a1),s5=st(a5),r=rsi(a1,14);
 document.getElementById('m5').innerHTML='<span class="dot '+(s5.trend==="BUY"?'dot-buy':'dot-sell')+'"></span> '+s5.trend;
 document.getElementById('m1').innerHTML='<span class="dot '+(s1.trend==="BUY"?'dot-buy':'dot-sell')+'"></span> '+s1.trend;
 let rc=r>55?'rsi-high':r<45?'rsi-low':'rsi-mid';
 document.getElementById('rsi').innerHTML='<span class="'+rc+'">'+r.toFixed(1)+(r>55?' ▲ Strong':r<45?' ▼ Strong':' ~ Neutral')+'</span>';
 let sig="WAIT";
 if(s5.trend==="BUY"&&s1.trend==="BUY"&&r>55) sig="BUY";
 else if(s5.trend==="SELL"&&s1.trend==="SELL"&&r<45) sig="SELL";
 else if((s5.trend==="BUY"&&s1.trend==="BUY")||(s5.trend==="SELL"&&s1.trend==="SELL")) sig="WAIT_RSI";
 update(sig,r);
}
function update(sig,r){
 let box=document.getElementById('sigBox'),ic=document.getElementById('sigIcon'),sb=document.getElementById('sigSub');
 if(sig==="BUY"){box.className="signal signal-buy";ic.textContent="🟢 V75 BUY NOW";sb.textContent="M5+M1 BUY + RSI "+r.toFixed(1)+" Strong → BUY";}
 else if(sig==="SELL"){box.className="signal signal-sell";ic.textContent="🔴 V75 SELL NOW";sb.textContent="M5+M1 SELL + RSI "+r.toFixed(1)+" Strong → SELL";}
 else if(sig==="WAIT_RSI"){box.className="signal signal-wait";ic.textContent="🟡 WAIT RSI "+r.toFixed(0);sb.textContent="Trends match but RSI "+r.toFixed(1)+" neutral, need >55 or <45";}
 else{box.className="signal signal-wait";ic.textContent="🟡 WAIT";sb.textContent="M5 & M1 not aligned";}
}
function chg(d){mult=Math.max(1,Math.min(6,mult+d));document.getElementById('mult').textContent=mult.toFixed(1);if(m1C.length>20)analyze();}
for(let i=0;i<35;i
